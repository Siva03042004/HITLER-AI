<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080c14">
  <title>Sign in · HITLER AI</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <main class="auth-shell">
    <a class="brand" href="/login"><span class="brand-mark">H</span><span><strong>HITLER AI</strong><small>TC PRIVATE LIMITED</small></span></a>
    <section class="auth-card">
      <div class="eyebrow">YOUR PERSONAL AI WORKSPACE</div>
      <h1>Welcome back.</h1>
      <p class="intro">Sign in to continue to your AI workspace.</p>
      <form id="loginForm">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          <button type="button" class="toggle" data-toggle="password">Show</button>
        </div>
        <button class="submit" type="submit">Sign in <span>→</span></button>
        <p class="message" id="message" role="status" aria-live="polite"></p>
      </form>
      <p class="switch">New to HITLER AI? <a href="/signup">Create an account</a></p>
    </section>
    <p class="footnote">Secure account access · Your password is never stored in plain text.</p>
  </main>
  <script src="/auth-ui.js"></script>
</body>
</html>
